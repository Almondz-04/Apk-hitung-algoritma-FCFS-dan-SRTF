<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F7F1E9">

    <title>AVIRA - CPU Scheduling Simulator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
   <div id="splash-screen">
  <!-- Background -->
  <img src="assets/background.png" class="splash-bg-img" alt="Background">

  <div class="splash-content">
    <!-- Logo AVIRA -->
    <img src="assets/avira-logo.png" alt="AVIRA Logo" class="splash-logo fade-element delay-1">
    
    <!-- Desc -->
    <p class="splash-subtitle fade-element delay-2">CPU Scheduling Simulator</p>
    
    <!-- Bar -->
    <div class="splash-loader fade-element delay-3">
      <div class="splash-progress"></div>
    </div>
  </div>
</div>

    <main id="app" class="app-container"></main>

    <script src="js/app.js"></script>
</body>
</html>
